[buildout]
index = https://pypi.org/simple/
extends = https://dist.plone.org/release/5.2.14/versions.cfg
find-links =
    https://dist.plone.org/release/5.2.14/
    https://dist.plone.org/thirdparty/

parts =
    zeoserver
    instance

eggs =
    senaite.lims
    senaite.core
    senaite.storage
    senaite.jsonapi
    senaite.impress
    senaite.app.listing
    senaite.app.supermodel
    senaite.app.spotlight
    senaite.databox
    senaite.ast
    senaite.microorganism
    senaite.panic

eggs-directory = /opt/senaite/eggs
download-cache = /opt/senaite/downloads


[zeoserver]
recipe = plone.recipe.zeoserver
zeo-address = 0.0.0.0:8100
blob-storage = /data/blobstorage


[instance]
recipe = plone.recipe.zope2instance
http-address = 0.0.0.0:8080
user = admin:admin
zeo-client = on
zeo-address = 127.0.0.1:8100
shared-blob = off
blob-storage = /data/blobstorage
wsgi = on
eggs =
    ${buildout:eggs}


[versions]
# stack 2.6.0
senaite.lims = 2.6.0
senaite.core = 2.6.0
senaite.storage = 2.6.0
senaite.jsonapi = 2.6.0
senaite.impress = 2.6.0
senaite.app.listing = 2.6.0
senaite.app.supermodel = 2.6.0
senaite.app.spotlight = 2.6.0
senaite.databox = 2.6.0

# extras (só se essas versões existirem mesmo)
senaite.ast = 1.2.0
senaite.microorganism = 1.2.0
senaite.panic = 2.1.0

# teu pin
et-xmlfile = 1.1.0
