[buildout]
index = https://pypi.org/simple/
extends = https://dist.plone.org/release/5.2.14/versions.cfg
find-links =
    https://dist.plone.org/release/5.2.14/
    https://dist.plone.org/thirdparty/

parts =
    zeoserver
    instance

eggs =
    senaite.lims

# cache dentro da imagem (não em /data)
eggs-directory = /opt/senaite/eggs
download-cache = /opt/senaite/downloads

[zeoserver]
recipe = plone.recipe.zeoserver
zeo-address = 0.0.0.0:8100
blob-storage = /data/blobstorage

[instance]
recipe = plone.recipe.zope2instance
http-address = 0.0.0.0:8080
user = admin:admin
zeo-client = on
zeo-address = 127.0.0.1:8100
shared-blob = off
blob-storage = /data/blobstorage
wsgi = on
eggs =
    ${buildout:eggs}

[versions]
senaite.lims = 2.6.0
et-xmlfile = 1.1.0
